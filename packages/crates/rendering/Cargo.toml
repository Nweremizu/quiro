[package]
name = "quiro-rendering"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
bytemuck = { version = "1.7", features = ["derive"] }
quiro-camera-effects = { path = "../camera-effects" }
quiro-text = { path = "../text" }
quiro-flags = { path = "../flags" }
quiro-project = { path = "../project" }
quiro-video-decode = { path = "../video-decode" }
quiro-cursor-info = { path = "../cursor-info" }
ffmpeg-hw-device = { path = "../ffmpeg-hw-device" }
tokio.workspace = true
ffmpeg.workspace = true
futures = { workspace = true }
futures-intrusive = "0.5.0"
rayon = "1.10"
image = "0.25.2"
log = "0.4"
serde = { workspace = true }
serde_json = "1.0"
specta.workspace = true
thiserror.workspace = true
wgpu.workspace = true
bezier_easing = "0.1.1"
reactive_graph = "0.1.5"
glyphon = "0.9.0"
tracing.workspace = true
resvg = "0.45"
tiny-skia = "0.11"
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"

[target.'cfg(target_os = "macos")'.dependencies]
cidre.workspace = true
metal = "0.31"
objc2 = "0.6"
wgpu-hal = { workspace = true, features = ["metal"] }
wgpu-core.workspace = true
foreign-types = "0.5"

[target.'cfg(target_os = "windows")'.dependencies]
wgpu-hal = { workspace = true, features = ["dx12"] }
wgpu-core.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Threading",
] }
windows_0_58 = { package = "windows", version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D12",
] }

[dev-dependencies]
pretty_assertions = "1.4.1"
# Already in the tree via wgpu. Pulled in directly so the shaders can be parsed
# and type-checked without a GPU — see `shader_validation_tests`.
naga = { version = "25.0.1", features = ["wgsl-in"] }
# Blocks on the async wgpu device/readback calls in the headless pixel tests.
pollster = "0.4.0"

[build-dependencies]
build-time = "0.1"
