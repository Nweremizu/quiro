[package]
name = "quiro-editor"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
quiro-media = { path = "../media" }
quiro-project = { path = "../project" }
quiro-rendering = { path = "../rendering" }
quiro-audio = { path = "../audio" }
quiro-media-info = { path = "../media-info" }

tokio = { workspace = true, features = ["macros", "process", "fs"] }
cpal.workspace = true
axum = { version = "0.7.5", features = ["ws"] }
ffmpeg.workspace = true
specta.workspace = true
serde = { workspace = true }
sentry.workspace = true
futures = { workspace = true }
tracing.workspace = true
flume.workspace = true
tokio-util = "0.7.15"
ringbuf = "0.4.8"
lru = "0.12"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_Media"] }

[dev-dependencies]
tempfile = "3"
