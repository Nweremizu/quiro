name: Set up toolchain
description: Node + pnpm + Rust + platform deps + caches, shared by every workflow.

inputs:
  rust:
    description: Install the Rust toolchain and rust-cache.
    default: "true"
  rust-targets:
    description: Extra rustup targets, comma-separated.
    default: ""
  cache-key:
    description: Suffix for the Rust cache key (e.g. the job name).
    default: ""

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Install Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm

    - name: Install JS dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Remove Windows-only cargo env (non-Windows)
      # .cargo/config.toml's [env] table (FFMPEG_DIR, LIBCLANG_PATH, etc.) is
      # Windows-only content — it points at target/native-deps and a Windows
      # LLVM install that don't exist elsewhere. Cargo has no per-target
      # `[env]` scoping to gate it with, and `force = true` means it clobbers
      # whatever this job exports for the same keys. Deleting the file here
      # (this is a throwaway CI checkout) is the only reliable way to keep it
      # from breaking pkg-config-based FFmpeg/libclang discovery on Linux/macOS.
      if: runner.os != 'Windows'
      shell: bash
      run: rm -f .cargo/config.toml

    - name: Linux system dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          libappindicator3-dev \
          librsvg2-dev \
          patchelf \
          libasound2-dev \
          libpulse-dev \
          libudev-dev \
          libgtk-3-dev \
          libxdo-dev \
          libavcodec-dev \
          libavformat-dev \
          libavfilter-dev \
          libavdevice-dev \
          libavutil-dev \
          libswscale-dev \
          libswresample-dev \
          libclang-dev
        # bindgen's libclang autodetection has a hardcoded list of llvm-N
        # paths that lags Ubuntu's default LLVM version, so `libclang-dev`
        # alone isn't always enough — point it at whatever actually got
        # installed.
        echo "LIBCLANG_PATH=$(dirname "$(find /usr/lib -iname 'libclang.so*' -o -iname 'libclang-*.so*' | head -n1)")" >> "$GITHUB_ENV"

    - name: macOS FFmpeg
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install ffmpeg pkg-config llvm
        # bindgen (coreaudio-sys et al.) needs libclang; Xcode's clang doesn't
        # ship it as a discoverable shared lib, so point at Homebrew's LLVM.
        echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
        # Homebrew's clang has no built-in notion of the macOS SDK, so it
        # can't find framework headers like AudioUnit/AudioUnit.h that
        # coreaudio-sys's `#include`s expect. Point bindgen at the SDK.
        SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
        echo "SDKROOT=$SDKROOT" >> "$GITHUB_ENV"
        echo "BINDGEN_EXTRA_CLANG_ARGS=-isysroot $SDKROOT" >> "$GITHUB_ENV"

    - name: Install Rust
      if: inputs.rust == 'true'
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
        targets: ${{ inputs.rust-targets }}

    - name: Rust cache
      if: inputs.rust == 'true'
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ inputs.cache-key }}
        workspaces: ". -> target"
