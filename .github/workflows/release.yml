name: Release

# Triggered by a semver tag push (v1.0.0, v1.2.3-beta.1, etc.)
# or manually via the Actions UI for testing the build without publishing.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build installers without uploading to GitHub Releases"
        type: boolean
        default: true

# Needs write access to create/update GitHub Releases.
permissions:
  contents: write

# Prevent two releases from running simultaneously on the same ref.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Preflight ─────────────────────────────────────────────────────────────
  # Fast gate: typecheck + unit tests before spending time on platform builds.
  # Runs only on Linux to keep it cheap; feature tests run per-platform in CI.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

  # ── 2. Platform builds ───────────────────────────────────────────────────────
  # Runs on all three platforms in parallel after preflight passes.
  # Each job builds the app and either publishes a GitHub Release draft or
  # skips upload for dry runs.
  build:
    name: Build — ${{ matrix.name }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # finish all platforms even if one fails
      matrix:
        include:
          - os: windows-latest
            name: Windows
            eb_flag: --win
          - os: macos-latest
            name: macOS
            eb_flag: --mac
          - os: ubuntu-latest
            name: Linux
            eb_flag: --linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Caching the Electron binary (~100 MB) and electron-builder cache
      # (~200 MB of Wine, tools, etc.) cuts install time significantly.
      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Install Linux display server
        if: runner.os == 'Linux'
        run: sudo apt-get install -y xvfb

      - name: Install dependencies
        run: npm ci

      # Compiles the renderer (Vite) and the Electron main/preload processes.
      # electron-builder then packages the output into a platform installer.
      - name: Build app
        run: npm run build:app

      # Signing secrets are optional — builds succeed without them but produce
      # unsigned installers (SmartScreen warning on Windows, Gatekeeper on Mac).
      #
      # To enable signing, add these repository secrets:
      #   Windows : CSC_LINK, CSC_KEY_PASSWORD
      #   macOS   : CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID,
      #             APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
      - name: Package & publish
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: >
          npx electron-builder ${{ matrix.eb_flag }}
          --publish ${{ github.event.inputs.dry_run == 'true' && 'never' || 'always' }}

      # Upload installers as Actions artifacts so they're downloadable directly
      # from the workflow run page — useful for manual QA before publishing the
      # draft release, and for dry-run builds that skip GitHub Releases upload.
      - name: Upload installer artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: |
            release/**/*.exe
            release/**/*.dmg
            release/**/*.zip
            release/**/*.AppImage
            release/**/*.yml
          if-no-files-found: warn
          retention-days: 14

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          echo "### ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Version** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Publish** | ${{ github.event.inputs.dry_run == 'true' && 'Dry run — not uploaded' || 'GitHub Releases draft' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | @${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
