name: Publish Release

# Single trigger per release: pushing a tag (locally or via publishing a
# GitHub release, which creates the tag ref) fires exactly one run. Keeping a
# `release: published` trigger as well caused a duplicate full rebuild.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing release tag to rebuild and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag_name || github.ref_name || github.run_id }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag_name: ${{ steps.prepare.outputs.tag_name }}
      package_version: ${{ steps.prepare.outputs.package_version }}
      source_sha: ${{ steps.prepare.outputs.source_sha }}
      prerelease: ${{ steps.prepare.outputs.prerelease }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag_name || github.ref_name }}
          fetch-depth: 0

      - name: Validate release tag
        id: prepare
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ github.event.inputs.tag_name }}"
          else
            TAG_NAME="${GITHUB_REF_NAME}"
          fi
          IS_PRERELEASE="$(gh release view "$TAG_NAME" --repo "${{ github.repository }}" --json isPrerelease --jq '.isPrerelease' 2>/dev/null || echo false)"

          if [ -z "$TAG_NAME" ]; then
            echo "Release tag is required."
            exit 1
          fi

          TAG_VERSION="${TAG_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./apps/desktop/package.json').version")"

          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Release tag version ($TAG_VERSION) does not match package.json version ($PACKAGE_VERSION)."
            exit 1
          fi

          gh release view "$TAG_NAME" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "$TAG_NAME" --repo "${{ github.repository }}" --verify-tag --title "$TAG_NAME" --generate-notes

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

  build-windows-x64:
    name: Build Windows x64
    needs: prepare-release
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.source_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure Windows signing
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_P12_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_P12_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_P12_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD)) {
            Write-Warning "Windows signing secrets are missing. Building an unsigned installer."
            Add-Content -Path $env:GITHUB_ENV -Value "CSC_IDENTITY_AUTO_DISCOVERY=false"
            exit 0
          }

          $certPath = Join-Path $env:RUNNER_TEMP "windows-signing-cert.p12"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_P12_BASE64))
          Add-Content -Path $env:GITHUB_ENV -Value "WIN_CSC_LINK=$certPath"
          Add-Content -Path $env:GITHUB_ENV -Value "WIN_CSC_KEY_PASSWORD=$env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Copy WASM assets
        run: npm run copy:wasm -w @quiro/desktop

      - name: Remove stale uiohook build output
        shell: pwsh
        run: |
          if (Test-Path node_modules/uiohook-napi/build) {
            Remove-Item node_modules/uiohook-napi/build -Recurse -Force
          }

      - name: Install app dependencies
        working-directory: apps/desktop
        run: npx electron-builder install-app-deps

      - name: Run unit tests
        run: npm run test:unit -w @quiro/desktop

      - name: Build Windows x64
        working-directory: apps/desktop
        shell: pwsh
        run: |
          npm run build:platform-native-helpers -w @quiro/desktop
          npm run build:app -w @quiro/desktop
          npx electron-builder --win dir nsis --x64 --publish never

      - name: Generate Windows checksums
        shell: pwsh
        run: |
          $uploadDir = "release-upload"
          if (Test-Path $uploadDir) {
            Remove-Item $uploadDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $uploadDir | Out-Null

          $files = Get-ChildItem -Path apps/desktop/release -Recurse -File -Include *.exe,*.blockmap,latest*.yml |
            Where-Object { $_.FullName -notmatch '[\\/]win-unpacked[\\/]' }

          if ($files.Count -eq 0) {
            throw "No Windows release files found."
          }

          $seenNames = @{}
          foreach ($file in $files) {
            if ($seenNames.ContainsKey($file.Name)) {
              throw "Duplicate release asset name found: $($file.Name)"
            }
            $seenNames[$file.Name] = $true
            Copy-Item -LiteralPath $file.FullName -Destination (Join-Path $uploadDir $file.Name)
          }

          $stagedFiles = Get-ChildItem -Path $uploadDir -File
          $lines = foreach ($file in $files) {
            $hash = Get-FileHash -Algorithm SHA256 -Path $file.FullName
            "$($hash.Hash.ToLowerInvariant())  $($file.Name)"
          }

          # LF endings so `sha256sum -c` works on any platform
          $checksumPath = Join-Path $uploadDir "SHA256SUMS-windows-x64.txt"
          [IO.File]::WriteAllText($checksumPath, ((($lines | Sort-Object) -join "`n") + "`n"))

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-release
          path: |
            release-upload/*.exe
            release-upload/*.blockmap
            release-upload/latest*.yml
            release-upload/SHA256SUMS-windows-x64.txt
          if-no-files-found: error

  build-macos:
    name: Build macOS (x64 + arm64)
    needs: prepare-release
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.source_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # macOS auto-updates REQUIRE a signed build (electron-updater refuses to
      # install unsigned updates on macOS). Signing happens when the secrets
      # exist; otherwise we ship an unsigned build and surface a warning.
      - name: Configure macOS signing and notarization
        env:
          MACOS_SIGNING_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_SIGNING_CERTIFICATE_P12_BASE64 }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          if [ -z "${MACOS_SIGNING_CERTIFICATE_P12_BASE64:-}" ] || [ -z "${MACOS_SIGNING_CERTIFICATE_PASSWORD:-}" ]; then
            echo "::warning::macOS signing secrets are missing. Building UNSIGNED packages — auto-update will not work on macOS and Gatekeeper will block first launch."
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            exit 0
          fi

          CERT_PATH="$RUNNER_TEMP/macos-signing-cert.p12"
          printf '%s' "$MACOS_SIGNING_CERTIFICATE_P12_BASE64" | base64 -d > "$CERT_PATH"
          {
            echo "CSC_LINK=$CERT_PATH"
            echo "CSC_KEY_PASSWORD=$MACOS_SIGNING_CERTIFICATE_PASSWORD"
          } >> "$GITHUB_ENV"

          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            {
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
              echo "QUIRO_MAC_NOTARIZE=true"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::Apple notarization secrets are missing. The app will be signed but NOT notarized — Gatekeeper will warn users on first launch."
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Copy WASM assets
        run: npm run copy:wasm -w @quiro/desktop

      - name: Remove stale uiohook build output
        run: rm -rf node_modules/uiohook-napi/build

      - name: Install app dependencies
        working-directory: apps/desktop
        run: npx electron-builder install-app-deps

      - name: Generate macOS icon (ICNS)
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          ICONSET_DIR="$(mktemp -d)/Quiro.iconset"
          mkdir -p "$ICONSET_DIR"
          SRC="icons/icons/png/quiro-512.png"
          sips -z 16   16   "$SRC" --out "$ICONSET_DIR/icon_16x16.png"
          sips -z 32   32   "$SRC" --out "$ICONSET_DIR/icon_16x16@2x.png"
          sips -z 32   32   "$SRC" --out "$ICONSET_DIR/icon_32x32.png"
          sips -z 64   64   "$SRC" --out "$ICONSET_DIR/icon_32x32@2x.png"
          sips -z 128  128  "$SRC" --out "$ICONSET_DIR/icon_128x128.png"
          sips -z 256  256  "$SRC" --out "$ICONSET_DIR/icon_128x128@2x.png"
          sips -z 256  256  "$SRC" --out "$ICONSET_DIR/icon_256x256.png"
          sips -z 512  512  "$SRC" --out "$ICONSET_DIR/icon_256x256@2x.png"
          sips -z 512  512  "$SRC" --out "$ICONSET_DIR/icon_512x512.png"
          sips -z 1024 1024 "$SRC" --out "$ICONSET_DIR/icon_512x512@2x.png"
          mkdir -p icons/icons/mac
          iconutil --convert icns "$ICONSET_DIR" --output icons/icons/mac/icon.icns
          rm -rf "$ICONSET_DIR"

      - name: Build macOS native helpers (Swift)
        working-directory: apps/desktop
        run: npm run build:platform-native-helpers -w @quiro/desktop

      - name: Build app (Vite + TypeScript)
        working-directory: apps/desktop
        run: npm run build:app -w @quiro/desktop

      - name: Build macOS packages (DMG + ZIP, x64 + arm64)
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          if [ "${QUIRO_MAC_NOTARIZE:-}" = "true" ]; then
            npx electron-builder --mac dmg zip --x64 --arm64 --publish never -c.mac.notarize=true
          else
            npx electron-builder --mac dmg zip --x64 --arm64 --publish never
          fi

      - name: Collect and checksum macOS artifacts
        run: |
          set -euo pipefail
          UPLOAD_DIR="release-upload-mac"
          rm -rf "$UPLOAD_DIR"
          mkdir -p "$UPLOAD_DIR"

          # electron-builder outputs to apps/desktop/release/${version}/
          # -maxdepth 2 avoids descending into mac/ and mac-arm64/ unpacked dirs
          find apps/desktop/release -maxdepth 2 \( \
            -name "*.dmg" -o \
            -name "*.dmg.blockmap" -o \
            -name "*.zip" -o \
            -name "*.zip.blockmap" -o \
            -name "latest-mac.yml" \
          \) | while read -r f; do
            name="$(basename "$f")"
            if [ -e "$UPLOAD_DIR/$name" ]; then
              echo "Duplicate asset: $name" && exit 1
            fi
            cp "$f" "$UPLOAD_DIR/$name"
          done

          (cd "$UPLOAD_DIR" && shasum -a 256 -- *.dmg *.dmg.blockmap *.zip *.zip.blockmap latest-mac.yml | sort > SHA256SUMS-macos.txt)

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            release-upload-mac/*.dmg
            release-upload-mac/*.dmg.blockmap
            release-upload-mac/*.zip
            release-upload-mac/*.zip.blockmap
            release-upload-mac/latest-mac.yml
            release-upload-mac/SHA256SUMS-macos.txt
          if-no-files-found: error

  publish-release-assets:
    name: Publish release assets
    needs:
      - prepare-release
      - build-windows-x64
      - build-macos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-x64-release
          path: release-assets/windows-x64

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: release-assets/macos

      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob

          mkdir -p release-assets/upload
          assets=(
            release-assets/windows-x64/*.exe
            release-assets/windows-x64/*.blockmap
            release-assets/windows-x64/latest*.yml
            release-assets/windows-x64/SHA256SUMS-windows-x64.txt
            release-assets/macos/*.dmg
            release-assets/macos/*.dmg.blockmap
            release-assets/macos/*.zip
            release-assets/macos/*.zip.blockmap
            release-assets/macos/latest-mac.yml
            release-assets/macos/SHA256SUMS-macos.txt
          )

          if [ ${#assets[@]} -eq 0 ]; then
            echo "No release assets found to upload."
            exit 1
          fi

          for file in "${assets[@]}"; do
            target="release-assets/upload/$(basename "$file")"
            if [ -e "$target" ]; then
              echo "Duplicate release asset name: $(basename "$file")"
              exit 1
            fi
            cp "$file" "$target"
          done

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets/upload

          # 1. Checksums must match — catches artifact corruption in transit.
          sha256sum -c SHA256SUMS-windows-x64.txt
          sha256sum -c SHA256SUMS-macos.txt

          # 2. The updater metadata must advertise exactly the tagged version,
          #    otherwise shipped clients would update to the wrong build.
          EXPECTED_VERSION="${{ needs.prepare-release.outputs.package_version }}"
          for yml in latest*.yml; do
            ADVERTISED="$(grep -m1 '^version:' "$yml" | awk '{print $2}' | tr -d '\r')"
            if [ "$ADVERTISED" != "$EXPECTED_VERSION" ]; then
              echo "$yml advertises version $ADVERTISED but the release tag is $EXPECTED_VERSION."
              exit 1
            fi
            echo "$yml: version $ADVERTISED OK"
          done

      - name: Upload release assets to GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          assets=(release-assets/upload/*)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No release assets found to upload."
            exit 1
          fi

          gh release upload "${{ needs.prepare-release.outputs.tag_name }}" \
            "${assets[@]}" \
            --repo "${{ github.repository }}" \
            --clobber
