name: Build & publish

# Reusable release engine. `release.yml` (tags) and `nightly.yml` (schedule)
# both call this. It builds every platform, attaches installers to a GitHub
# Release as a mirror / download page, generates the Tauri auto-update
# manifest, and publishes both to Cloudflare R2 (the updater's real source).

on:
  workflow_call:
    inputs:
      version:
        description: Semver to stamp into the build (no leading v).
        required: true
        type: string
      channel:
        description: stable | nightly
        required: true
        type: string
      tag:
        description: Git tag / release tag to publish under.
        required: true
        type: string
      prerelease:
        default: false
        type: boolean
      tauri-args:
        description: Extra args forwarded to `tauri build` (e.g. an alt config).
        default: ""
        type: string

permissions:
  contents: write

env:
  # Public URL the updater and manifest point at. Set once in repo settings
  # (Settings -> Secrets and variables -> Actions -> Variables). Empty = the
  # R2 publish step is skipped and only the GitHub Release is produced.
  BASE_URL: ${{ vars.RELEASE_BASE_URL }}

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc
          # Linux x64 is out for now: quiro-recording/rendering/text have
          # real compile errors there (never a working target), not a CI
          # config issue. Re-add once that's fixed as its own task.
          - label: macOS arm64
            os: macos-latest
            rust-target: aarch64-apple-darwin
          # macOS x64 is out: Quiro ships Apple Silicon only. Building it on
          # macos-latest can't work anyway — those runners are arm64, so
          # Homebrew's FFmpeg is arm64 and linking an x86_64 binary against it
          # fails on undefined symbols. It would need the (being-retired)
          # Intel macos-13 image, or a universal build with both arch's libs.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          rust-targets: ${{ matrix.rust-target }}
          cache-key: build-${{ matrix.rust-target }}

      - name: Fetch native deps
        run: |
          node scripts/setup-onnxruntime.js
          node scripts/setup-ffmpeg.mjs

      - name: Stamp version + updater channel
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const [version, base, channel] = process.argv.slice(1);
            for (const f of [
              "apps/desktop/src-tauri/tauri.conf.json",
              "apps/desktop/src-tauri/tauri.nightly.conf.json",
            ]) {
              const j = JSON.parse(fs.readFileSync(f));
              if ("version" in j) j.version = version;
              if (base && j.plugins?.updater?.endpoints)
                j.plugins.updater.endpoints = [`${base}/${channel}/latest.json`];
              fs.writeFileSync(f, JSON.stringify(j, null, "\t") + "\n");
            }
          ' "${{ inputs.version }}" "$BASE_URL" "${{ inputs.channel }}"

      - name: Build & upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Auto-update signature — required for updates to install.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code signing + notarization is deliberately not wired up
          # yet (no certificates until there's an Apple Developer account).
          #
          # These are NOT merely omitted-because-optional: a missing secret
          # expands to an empty string, and the bundler treats "set but
          # empty" as "set", so it tries to import a zero-byte certificate
          # and fails with "failed to import keychain certificate". Passing
          # them only looks harmless.
          #
          # To enable signing later, add the certificates as repo secrets and
          # restore: APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
          # APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID.
        with:
          projectPath: apps/desktop
          tagName: ${{ inputs.tag }}
          releaseName: Quiro ${{ inputs.version }}
          releaseBody: See CHANGELOG.md.
          releaseDraft: true
          prerelease: ${{ inputs.prerelease }}
          args: ${{ inputs.tauri-args }} --target ${{ matrix.rust-target }}

      - name: Stamp the arch onto the macOS updater payload
        # Tauri names it "<App>.app.tar.gz" with no architecture — every other
        # bundle carries one. Without this it matches none of the generator's
        # darwin suffixes and macOS drops out of latest.json, and two arches
        # would collide on one basename once the bundles are flattened.
        #
        # It has to happen here, not at flatten time: upload-artifact strips
        # the common path prefix, so the target-triple directory is gone by
        # then and there's nothing left to infer the arch from.
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          dir="target/${{ matrix.rust-target }}/release/bundle/macos"
          case "${{ matrix.rust-target }}" in
            aarch64-*) arch=aarch64 ;;
            x86_64-*)  arch=x64 ;;
            *)         echo "unhandled target"; exit 1 ;;
          esac
          for payload in "$dir"/*.app.tar.gz; do
            [ -e "$payload" ] || continue
            base=$(basename "$payload" .app.tar.gz)
            # Skip an already-stamped name, so a re-run on a warm build dir
            # can't produce Quiro_aarch64_aarch64.app.tar.gz — which would
            # match no platform and drop macOS from the manifest again.
            case "$base" in *_"$arch") continue ;; esac
            mv "$payload" "$dir/${base}_${arch}.app.tar.gz"
            if [ -e "$payload.sig" ]; then
              mv "$payload.sig" "$dir/${base}_${arch}.app.tar.gz.sig"
            fi
          done
          ls -la "$dir"

      - name: Collect bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.rust-target }}
          # Workspace target dir is at the repo root; `--target` nests bundles
          # one level deeper by triple.
          path: |
            target/${{ matrix.rust-target }}/release/bundle/**/*.exe
            target/${{ matrix.rust-target }}/release/bundle/**/*.msi
            target/${{ matrix.rust-target }}/release/bundle/**/*.dmg
            target/${{ matrix.rust-target }}/release/bundle/**/*.AppImage
            target/${{ matrix.rust-target }}/release/bundle/**/*.deb
            target/${{ matrix.rust-target }}/release/bundle/**/*.sig
            target/${{ matrix.rust-target }}/release/bundle/**/*.tar.gz
            target/${{ matrix.rust-target }}/release/bundle/**/*.zip
          if-no-files-found: warn

  publish:
    name: Manifest & R2
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rust: "false"

      - uses: actions/download-artifact@v4
        with:
          path: downloaded
          pattern: bundles-*
          merge-multiple: true

      - name: Flatten bundles
        # The manifest references files by basename, so everything lands in one
        # directory and is uploaded flat.
        #
        # Every bundle carries its arch by the time it gets here (the macOS
        # updater payload is renamed in the build job), so basenames are
        # unique across platforms.
        run: |
          mkdir dist
          find downloaded -type f -exec cp -n {} dist/ \;
          ls -la dist

      - name: Generate release manifests
        run: |
          node scripts/gen-updater-manifest.mjs \
            --artifacts ./dist \
            --version "${{ inputs.version }}" \
            --channel "${{ inputs.channel }}" \
            --base-url "${BASE_URL:-https://REPLACE_WITH_RELEASE_HOST}" \
            --out ./manifest

      - name: Attach manifest to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          draft: true
          prerelease: ${{ inputs.prerelease }}
          files: |
            manifest/${{ inputs.channel }}/latest.json
            manifest/${{ inputs.channel }}/downloads.json

      - name: Publish to Cloudflare R2
        if: env.BASE_URL != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2: >-
            aws s3 --endpoint-url
            https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ vars.R2_BUCKET }}
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Immutable, cache-forever: the versioned installers + updater archives.
          $R2 cp ./dist "s3://$BUCKET/$CHANNEL/$VERSION/" \
            --recursive \
            --cache-control "public, max-age=31536000, immutable"
          # Mutable, must be fetched fresh: the channel manifest.
          $R2 cp "./manifest/$CHANNEL/latest.json" "s3://$BUCKET/$CHANNEL/latest.json" \
            --content-type application/json \
            --cache-control "no-cache"
          windows_installer=$(find ./dist -type f -name '*x64-setup.exe' -print -quit)
          macos_installer=$(find ./dist -type f -name '*aarch64.dmg' -print -quit)
          test -n "$windows_installer"
          test -n "$macos_installer"
          $R2 cp "$windows_installer" "s3://$BUCKET/$CHANNEL/downloads/quiro-windows-x64.exe" \
            --content-type application/vnd.microsoft.portable-executable \
            --content-disposition 'attachment; filename="Quiro-Windows-x64.exe"' \
            --cache-control "no-cache"
          $R2 cp "$macos_installer" "s3://$BUCKET/$CHANNEL/downloads/quiro-macos-arm64.dmg" \
            --content-type application/x-apple-diskimage \
            --content-disposition 'attachment; filename="Quiro-macOS-arm64.dmg"' \
            --cache-control "no-cache"
          $R2 cp "./manifest/$CHANNEL/downloads.json" "s3://$BUCKET/$CHANNEL/downloads.json" \
            --content-type application/json \
            --cache-control "no-cache"
          echo "Published $CHANNEL $VERSION -> $BASE_URL/$CHANNEL/"

      - name: Un-draft the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          draft: false
          prerelease: ${{ inputs.prerelease }}
