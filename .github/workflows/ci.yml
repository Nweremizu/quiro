name: CI

on:
  pull_request:
  push:
    branches: [main]

# One in-flight run per ref; a new push cancels the old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Lint · typecheck · checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          rust: "false"
      - name: Biome
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Geometry / arrow self-checks
        run: pnpm check
      - name: Frontend bundle
        run: pnpm --filter desktop build:app
      - name: Marketing site
        run: pnpm --filter @quiro/web build

  rust:
    name: rustfmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: ci-rust
      - name: Fetch native deps
        run: |
          node scripts/setup-onnxruntime.js
          node scripts/setup-ffmpeg.mjs
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cosmic-text version check
        # quiro-text (cosmic-text directly) and quiro-rendering (cosmic-text
        # via glyphon) must resolve to the exact same version, or Buffer
        # becomes two incompatible types sharing one name at the crate
        # boundary between them — a failure Cargo itself does not catch at
        # `cargo check` time. See plans/text-engine/001-quiro-text-crate.md.
        run: |
          versions=$(cargo tree -i cosmic-text | grep -oE 'cosmic-text v[0-9.]+' | sort -u)
          count=$(echo "$versions" | grep -c .)
          if [ "$count" -ne 1 ]; then
            echo "Expected exactly one cosmic-text version across the workspace, found $count:"
            echo "$versions"
            exit 1
          fi
      - name: Build quiro-muxer
        # The OOP muxer integration tests (packages/crates/recording/tests/oop_muxer.rs)
        # spawn this binary directly from target/{debug,release} rather than
        # depending on it as a crate, so `cargo test --workspace` never builds
        # it on its own.
        run: cargo build -p quiro-muxer
      - name: test
        # sync_matrix.rs's test is #[ignore]d here (default seed derives from
        # system time, so it isn't reproducible run-to-run) and runs instead
        # on its own schedule via .github/workflows/sync-tests.yml, mirroring
        # how Cap gates the same test.
        run: cargo test --workspace

  # Proves the installers still bundle, without publishing. Skipped on PRs to
  # keep them fast — runs on merges to main and on demand.
  #
  # ubuntu-latest is out for now: quiro-recording/rendering/text have real
  # compile errors on Linux (never a working target), not a CI config issue.
  # Re-add once that's fixed as its own task.
  bundle-smoke:
    name: Bundle (${{ matrix.os }})
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: smoke-${{ matrix.os }}
      - name: Fetch native deps
        run: |
          node scripts/setup-onnxruntime.js
          node scripts/setup-ffmpeg.mjs
      - name: Build bundles
        # No signing key on CI — build the installers without updater artifacts.
        run: pnpm --filter desktop tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-smoke-${{ matrix.os }}
          path: |
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.deb
          retention-days: 5
          if-no-files-found: error
