name: Website

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/web.yml"
  workflow_dispatch:

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Vercel deploys the site (apps/web/vercel.json); it serves API routes, so there
# is no static export to publish. This job only catches build breakage on main.
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
      NEXT_PUBLIC_RELEASE_BASE_URL: ${{ vars.RELEASE_BASE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          rust: "false"
      - name: Build website
        run: pnpm --filter @quiro/web build
