name: Tests

on:
  push:
    branches: [main]
  pull_request:

# Cancel redundant runs on the same branch/PR so each push doesn't queue
# behind the previous one.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
          # - os: ubuntu-latest
          #   name: Linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Caching the Electron binary avoids re-downloading ~100 MB on every run.
      # Paths cover all three platforms; non-existent paths are silently skipped.
      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      # uiohook-napi (native input hook) requires X11 headers to compile on Linux.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxt-dev libxtst-dev libxinerama-dev libxrandr-dev

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # `npm ci --ignore-scripts` skips Electron's postinstall, so
      # node_modules/electron/dist is absent. The first tests to import electron
      # then trigger a lazy download+extract, and because vitest runs test files
      # in parallel, multiple workers race to extract into the same dist. On
      # macOS they collide creating the `Electron Framework` symlink and fail
      # with EEXIST (Windows has no such symlink, so it only breaks on macOS).
      # Extract the binary once, serially, up front so no test worker has to.
      - name: Install Electron binary
        run: node node_modules/electron/install.js

      - name: Run desktop CI tests
        run: npm run test:ci -w @quiro/desktop

      - name: Typecheck web
        run: npm run typecheck -w @quiro/web
