name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Typecheck, Unit, Feature (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get install -y xvfb

      - name: Install dependencies
        run: npm ci

      - name: Run CI tests
        if: runner.os != 'Linux'
        run: npm run test:ci

      - name: Run CI tests (Linux with virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:ci

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload Playwright traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
