name: Tests

on:
  push:
    branches: [main]
  pull_request:

# Cancel redundant runs on the same branch/PR so each push doesn't queue
# behind the previous one.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
          # - os: ubuntu-latest
          #   name: Linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Caching the Electron binary avoids re-downloading ~100 MB on every run.
      # Paths cover all three platforms; non-existent paths are silently skipped.
      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      # uiohook-napi (native input hook) requires X11 headers to compile on Linux.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxt-dev libxtst-dev libxinerama-dev libxrandr-dev

      # Use `npm install` (not `npm ci`) so each platform fetches its own
      # native optional binaries (rolldown/esbuild). npm only records the
      # host platform's binding package nodes in package-lock.json
      # (npm/cli#4828), so `npm ci` on a non-Windows runner cannot install the
      # darwin/linux bindings the lockfile omits. The committed lockfile still
      # pins all resolutions; install only adds the platform-appropriate ones.
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run desktop CI tests
        run: npm run test:ci -w @quiro/desktop

      - name: Typecheck web
        run: npm run typecheck -w @quiro/web
