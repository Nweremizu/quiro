[package]
name = "quiro-desktop"
version = "0.1.2"
description = "Beautiful screen recordings, owned by you."
authors = ["you"]
edition = "2024"
# `src/bin/export-bindings.rs` is a second binary, so a bare `cargo run` —
# which is exactly what `tauri dev` issues — has no unambiguous target
# without this.
default-run = "quiro-desktop"


[lints]
workspace = true

[lib]
name = "quiro_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

# Behind a feature so it isn't built by default. Cargo auto-discovers
# src/bin/*, and Tauri bundles every binary the crate produces — so this
# developer tool was being installed onto users' machines as a stray 31 MB
# executable next to the app, and was being LTO'd in every release build for
# nothing (it's what ran the CI runner out of memory).
#
#   cargo run -p quiro-desktop --bin export-bindings --features export-bindings
[[bin]]
name = "export-bindings"
path = "src/bin/export-bindings.rs"
required-features = ["export-bindings"]

[features]
export-bindings = []



[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(target_os = "macos")'.build-dependencies]
swift-rs = { version = "1.0.6", features = ["build"] }

[dependencies]
tauri = { version = "2", features = [
    "tray-icon",
    "image-png",
    "devtools",
    "protocol-asset",
    # WebviewWindowBuilder::transparent() is compiled out on macOS without
    # this, and the camera preview / overlays are all built transparent.
    # Pairs with "macOSPrivateApi": true in tauri.conf.json.
    "macos-private-api",
] }
tauri-specta = { version = "=2.0.0-rc.20", features = ["derive", "typescript"] }
tauri-plugin-dialog = "2.2.0"
tauri-plugin-fs = "2.2.0"
tauri-plugin-global-shortcut = "2.2.0"
tauri-plugin-http = "=2.5.2"
tauri-plugin-notification = "2.2.0"
tauri-plugin-os = "2.2.0"
tauri-plugin-process = "2.2.0"
tauri-plugin-shell = "2.2.0"
tauri-plugin-single-instance = { version = "2.2.0", features = ["deep-link"] }
tauri-plugin-store = "2.2.0"
tauri-plugin-updater = "2.9.0"
tauri-plugin-window-state = "2.2.0"
tauri-plugin-positioner = "2.2.0"
tauri-plugin-deep-link = "2.2.0"
tauri-plugin-clipboard-manager = "2.2.1"
tauri-plugin-opener = "2"


serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta.workspace = true
specta-typescript = "0.0.7"
tokio = { workspace = true, features = ["signal"] }
uuid = { version = "1.10.0", features = ["v4"] }
image = "0.25.2"
futures-intrusive = "0.5.0"
anyhow.workspace = true
futures = { workspace = true }
axum = { version = "0.7.5", features = ["ws", "macros"] }
tracing.workspace = true
tempfile = "3.9.0"
ffmpeg.workspace = true
chrono = { version = "0.4.31", features = ["serde"] }
regex = "1.10.4"
rodio = "0.19.0"
png = "0.17.13"
device_query = "4.0.1"
base64 = "0.22.1"
reqwest = { version = "0.12.24", features = ["json", "stream", "multipart"] }
whisper-rs = "0.11.0"
lazy_static = "1.4.0"
log = "0.4.20"
quiro-audio = { path = "../../../packages/crates/audio" }
quiro-project = { path = "../../../packages/crates/project" }
dotenvy_macro = "0.15.7"
global-hotkey = "0.7.0"
scap-targets = { path = "../../../packages/crates/scap-targets" }
cpal.workspace = true
flume = "0.11.0"
kameo = "0.17.2"
tokio-util = "0.7.15"
tokio-stream = { version = "0.1.17", features = ["sync"] }
wgpu = { version = "25.0.0", features = ["wgpu-core"] }
pollster = "0.4"
bytemuck = "1.23.1"
thiserror = "1.0"
sysinfo = "0.35"
keyed_priority_queue = "0.4.2"
# `env-filter` is required by main.rs; it currently arrives via feature
# unification from quiro-editor, which would be a silent break if that changed.
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
relative-path = "1.9.3"
tokio-tungstenite = "0.24"

# The workspace crates the app is built out of. These are cross-platform —
# each gates its own OS-specific code internally — so they belong here rather
# than under a per-target table.
quiro-enc-ffmpeg = { path = "../../../packages/crates/enc-ffmpeg" }
quiro-media-info = { path = "../../../packages/crates/media-info" }
quiro-camera = { path = "../../../packages/crates/camera", features = ["serde", "specta"] }
quiro-camera-effects = { path = "../../../packages/crates/camera-effects" }
quiro-utils = { path = "../../../packages/crates/utils" }
quiro-export = { path = "../../../packages/crates/export" }
quiro-editor = { path = "../../../packages/crates/editor" }
quiro-rendering = { path = "../../../packages/crates/rendering" }
quiro-text = { path = "../../../packages/crates/text" }
quiro-media = { path = "../../../packages/crates/media" }
quiro-flags = { path = "../../../packages/crates/flags" }
quiro-recording = { path = "../../../packages/crates/recording" }
quiro-camera-ffmpeg = { path = "../../../packages/crates/camera-ffmpeg" }

[target.'cfg(not(all(target_os = "macos", target_arch = "x86_64")))'.dependencies]
parakeet-rs = "0.3.4"

[target.'cfg(target_os = "macos")'.dependencies]
# ScreenCaptureKit is Apple's — it was only ever under the Windows table
# because that table had become a catch-all.
scap-screencapturekit = { path = "../../../packages/crates/scap-screencapturekit" }
cidre = { workspace = true }
objc2 = "0.6"
objc2-app-kit = "0.3.1"
objc2-foundation = "0.3.1"
# CALayer's CGFloat-typed setters (setCornerRadius) are behind the
# objc2-core-foundation feature. objc2-app-kit pulls this crate in without it,
# so declare it here to turn them on — cargo features are additive.
objc2-quartz-core = { version = "0.3", features = [
    "CALayer",
    "objc2-core-foundation",
] }
# The camera preview is an NSPanel, not a window, so it can float over
# full-screen apps without stealing focus. Pinned to a rev rather than the
# branch so the build can't shift underneath us. The v2 branch (not v2.1) is
# the one that still re-exports `cocoa`, which this app's panel code imports;
# v2.1 moved to objc2 and requires Tauri 2.8.
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "18ffb9a201fbf6fedfaa382fd4b92315ea30ab1a" }
cocoa = "0.26.0"
objc = "0.2.7"
core-foundation = "0.10.0"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55.0"
webview2-com = "0.39.1"
# Must track the workspace version so HWND/handle types line up with
# scap-targets and scap-direct3d; webview2-com needs its own newer
# windows-core, which is why the two versions differ here.
windows = { workspace = true, features = [
    "Foundation",
    "Foundation_Collections",
    "Win32_Foundation",
    "Win32_System",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Graphics_Capture",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
] }
windows-sys = { workspace = true }
windows-core = "0.61.2"
scap-direct3d = { path = "../../../packages/crates/scap-direct3d" }
