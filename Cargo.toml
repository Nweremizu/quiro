[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "packages/crates/*",
]

[workspace.dependencies]
anyhow = { version = "1.0.86" }
# This includes a currently-unreleased fix that ensures the audio stream is actually
# stopped and released on drop on macOS, plus zeroing of WASAPI capture
# packets flagged AUDCLNT_BUFFERFLAGS_SILENT (loopback of an idle endpoint
# otherwise surfaces unspecified buffer contents as audio).
cpal = { git = "https://github.com/CapSoftware/cpal", rev = "6013cb5f8bd3" }
ffmpeg = { package = "ffmpeg-next", git = "https://github.com/CapSoftware/rust-ffmpeg", rev = "49db1fede112" }
tokio = { version = "1.39.3", features = [
    "macros",
    "process",
    "fs",
    "sync",
    "rt",
    "rt-multi-thread",
    "time",
] }
tauri = { version = "2.5.0", features = ["specta"] }
specta = { version = "=2.0.0-rc.20", features = [
    "derive",
    "serde_json",
    "uuid",
    "chrono"
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pinned to the exact patch version glyphon 0.9.0 links (packages/crates/rendering),
# so quiro-text's Buffer/FontSystem are the same type glyphon paints, not two
# incompatible types sharing one name. `cargo tree -d | grep cosmic-text` must
# report exactly one line; see plans/text-engine/001-quiro-text-crate.md.
cosmic-text = "0.14.2"

nokhwa = { git = "https://github.com/CapSoftware/nokhwa", rev = "b9c8079e82e2", features = [
    "input-native",
    "serialize",
] }
nokhwa-bindings-macos = { git = "https://github.com/CapSoftware/nokhwa", rev = "b9c8079e82e2" }
wgpu = { version = "25.0.0", features = ["wgpu-core"] }
wgpu-hal = "25.0.0"
wgpu-core = "25.0.0"
flume = "0.11.0"
thiserror = "1.0"
sentry = { version = "0.42.0", features = [
    "anyhow",
    "backtrace",
    "debug-images",
] }
tracing = "0.1.41"
futures = "0.3.31"
aho-corasick = "1.1.4"

cidre = { git = "https://github.com/CapSoftware/cidre", rev = "bf84b67079a8", features = [
    "macos_12_7",
    "cv",
    "cf",
    "cg",
    "core_audio",
    "sc",
    "av",
    "blocks",
    "async",
    "dispatch",
    "io_surface",
    "mtl",
    "vt",
    "vn",
], default-features = false }

windows = "0.60.0"
windows-core = "0.60"
windows-sys = "0.59.0"
windows-capture = "1.5.0"
percent-encoding = "2.3.1"
sysinfo = "0.32"

# TODO: Reenable these: https://github.com/CapSoftware/Cap/issues/859
[workspace.lints.rust]
deprecated = "allow"
unexpected_cfgs = "allow"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
let_underscore_future = "deny"
unchecked_time_subtraction = "deny"
collapsible_if = "deny"
clone_on_copy = "deny"
redundant_closure = "deny"
ptr_arg = "deny"
len_zero = "deny"
let_unit_value = "deny"
unnecessary_lazy_evaluations = "deny"
needless_range_loop = "deny"
manual_clamp = "deny"

[profile.dev]
debug = 1

# Dependencies — including the media crates below — are unusable unoptimised:
# a debug build of the renderer is roughly an order of magnitude slower than a
# release one, which makes any performance measured in `cargo run` meaningless.
# The app crate itself stays at opt-level 0 so iteration stays fast.
[profile.dev.package."*"]
debug = 0
opt-level = 2

# The per-pixel and per-sample paths, where the difference is largest.
[profile.dev.package.quiro-rendering]
opt-level = 3
[profile.dev.package.quiro-editor]
opt-level = 3
[profile.dev.package.quiro-export]
opt-level = 3
[profile.dev.package.quiro-audio]
opt-level = 3
[profile.dev.package.quiro-video-decode]
opt-level = 3
[profile.dev.package.quiro-enc-ffmpeg]
opt-level = 3
[profile.dev.package.quiro-project]
opt-level = 3
[profile.dev.package.quiro-camera-effects]
opt-level = 3

# Optimize for smaller binary size
[profile.release]
panic = "unwind"
codegen-units = 1 # Compile crates one after another so the compiler can optimize better
lto = true        # Enables link to optimizations
opt-level = "s"   # Optimize for binary size
# No debuginfo: carrying it through fat LTO with codegen-units = 1 exhausted
# the 16 GB on a Windows CI runner ("rustc-LLVM ERROR: out of memory"), and it
# contradicts opt-level = "s" — full symbols dwarf the binary they describe.
# Nothing consumes them either; there's no crash-reporting backend to
# symbolicate against. Use "line-tables-only" if panics ever need file/line.
debug = false

[patch.crates-io]
# screencapturekit = { git = "https://github.com/CapSoftware/screencapturekit-rs", rev = "7ff1e103742e56c8f6c2e940b5e52684ed0bed69" } # branch = "cap-main"
cidre = { git = "https://github.com/CapSoftware/cidre", rev = "bf84b67079a8" }
